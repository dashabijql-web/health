# ================================
# Server
# ================================
server:
  port: 8080
  servlet:
    context-path: /health
    session:
      timeout: 30m
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: health

  # ================================
  # Redis (write buffer for watch data)
  # ================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ================================
  # DataSource (Druid)
  # ================================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # Override via env: DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:58135};DatabaseName=${DB_NAME:health};characterEncoding=UTF-8;encrypt=true;trustServerCertificate=true;socketTimeout=45000
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123abcd.}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 8000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      use-global-data-source-stat: true
      # Druid monitor console: /health/druid
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:druid_admin}
        login-password: ${DRUID_PASSWORD:Xz@Druid2026!}
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: false

# ================================
# MyBatis-Plus
# ================================
mybatis-plus:
  mapper-locations: mybatis/com/xzkj/**/mapp*/*Mapper.xml
  type-aliases-package: com.xzkj.**.model
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-column-underline: true
    id-type: 0

# ================================
# Netty Server (device protocol)
# ================================
#
# TCP  (port 9000): all platforms, always enabled
# SCTP (port 9001): Linux only, enable on production via sctp.enabled=true
#
# Platform notes:
#   Linux  : load kernel module first: sudo modprobe sctp
#   Windows: SCTP not supported - keep sctp.enabled=false for local dev
#   macOS  : limited support, not recommended for production
#
# Both TCP and SCTP share the same business handlers and write to the same DB tables.
netty:
  # TCP server (primary protocol)
  server:
    enabled: true          # Windows/IDEA development - use TCP
    port: 9000             # watch devices connect here via TCP
    boss-threads: 1        # threads for accepting new connections
    worker-threads: 8      # threads for read/write (increased for 1000 watches)
    idle-timeout: 300      # read idle timeout in seconds - close connection if exceeded
    write-idle-timeout: 60 # write idle timeout in seconds - send heartbeat if exceeded

  # SCTP server (new - Linux production only)
  sctp:
    enabled: false        # Disabled for Windows development
    port: 9001             # watch devices connect here via SCTP
    boss-threads: 1
    worker-threads: 4
    idle-timeout: 300
    write-idle-timeout: 60

# ================================
# Actuator: /health/actuator/health
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ================================
# DeepSeek AI API
# ================================
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-key-file: ${DEEPSEEK_API_KEY_FILE:${user.home}/Desktop/deepseek-key.txt}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
  timeout-seconds: 60

# ================================
# Logging
# ================================
logging:
  level:
    com.xzkj.health: INFO
    io.netty: WARN
    org.springframework: INFO
    com.alibaba.druid: WARN
    com.microsoft.sqlserver: WARN
    org.apache.ibatis: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
