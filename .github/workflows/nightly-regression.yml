name: nightly-regression

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run nightly backend regression
        run: python scripts/run_backend_regression.py
