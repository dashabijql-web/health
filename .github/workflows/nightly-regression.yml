name: nightly-regression

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run nightly regression
        run: npm run audit:nightly
